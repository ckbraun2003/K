name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'test/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4        # version comes from packageManager field
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck               # pnpm -r typecheck (shared + core + web + desktop)
      - run: pnpm -r test                  # vitest (core + web + desktop)
      - run: pnpm build                   # pnpm -r build (core tsc + web tsc && vite build + desktop tsc)

  # Prove the Windows desktop packaging pipeline assembles (pnpm-deploy the portable
  # core, bundle the Node-20 runtime + web/agent-config, stage into an Electron app).
  # `run pack` = prepackage + `electron-builder --dir` (no installer — the full NSIS
  # build + publish happens in release.yml on a tag). Windows-only app, so windows-latest.
  desktop-build:
    runs-on: windows-latest
    # Windows packaging is heavy — run it on main + PRs to main (the gates that
    # matter), not on every feat/** push.
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20                # the runner's Node 20 is what prepackage bundles (ABI 115)
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build                   # shared/core/web/desktop — prepackage reuses these
      - run: pnpm --filter @k/desktop run pack   # prepackage (pnpm deploy + node bundle) + electron-builder --dir
        env:
          K_SKIP_BUILD: '1'               # reuse the `pnpm build` above; don't rebuild the whole workspace again
      # Heavy, hard-to-reproduce-locally Windows path — on failure, keep the staged
      # output for post-hoc inspection (builder logs already land in the Actions log).
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-packaging-output
          path: desktop/release/
          if-no-files-found: ignore
          retention-days: 7

  # Boot-level upgrade gate (DEH-FU-3): boot the real core against a COMMITTED
  # poisoned-stamp DB (previous-generation shape, current user_version) and require
  # the sentinel self-heal to fire. Catches module-level prepare crashes at import —
  # the 2026-07-13 outage class — which migrate() unit tests cannot see.
  upgrade-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node core/scripts/upgrade-smoke.mjs core/test/fixtures/poisoned-prev-gen.db
        env:
          K_SMOKE_EXPECT_POISON: '1'
          K_SMOKE_PORT: '3299'

  # Non-gating: the rigorous-testing campaign's confirmed-fault quarantine.
  # Tests here are RED by design (one per open fault) and MUST NOT block merges —
  # `continue-on-error` keeps them visible without failing the required `ci` job.
  regressions:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:regressions        # core + web quarantine (passWithNoTests when empty)
